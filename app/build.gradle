plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wangchuncheng.minesweeper'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.wangchuncheng.minesweeper"
        minSdk 21
        targetSdk 36
        versionCode 2
        versionName "1.1"
        // Vector launcher icon needs PNG fallbacks for API 21-25.
        vectorDrawables.generatedDensities ['mdpi','hdpi','xhdpi','xxhdpi','xxxhdpi']
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
